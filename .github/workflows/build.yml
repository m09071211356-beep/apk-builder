name: Build Android APK From Mobile Code
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          flutter create generated_app --org com.example
          cd generated_app
          
      - name: Inject Mobile Source Code
        run: |
          # استقبال الكود النصي المولد وحفظه داخل ملف تطبيق الفلاتر الرئيسي
          echo "${{ github.event.client_payload.code }}" > generated_app/lib/main.dart

      - name: Build APK
        run: |
          cd generated_app
          flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
